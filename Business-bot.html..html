
<!DOCTYPE html>
<html>
<head>
    <title>Ayomide Business Bot</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #101827;
            font-family: Arial, sans-serif;
            color: white;
            padding: 15px;
        }

        .chat-box {
            background: white;
            color: black;
            max-width: 450px;
            margin: 30px auto;
            border-radius: 15px;
            overflow: hidden;
        }

        .header {
            background: #1d4ed8;
            color: white;
            padding: 20px;
            text-align: center;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
        }

        .bot {
            background: #e5e7eb;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .user {
            background: #bfdbfe;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: right;
        }

        .input-area {
            display: flex;
            padding: 10px;
            gap: 5px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid gray;
            border-radius: 8px;
        }

        button {
            background: #1d4ed8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="chat-box">

    <div class="header">
        <h2>Ayomide Business Bot</h2>
        <p>Your business assistant</p>
    </div>

    <div id="messages">
        <div class="bot">
            Hello! Welcome to Ayomide Business.
            How can I help you today?
        </div>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

function sendMessage() {

    let input = document.getElementById("userInput");

    let message = input.value.trim();

    if (message === "") {
        return;
    }

    let chat = document.getElementById("messages");

    let userMessage = document.createElement("div");

    userMessage.className = "user";

    userMessage.textContent = message;

    chat.appendChild(userMessage);

    let reply = "";

    let question = message.toLowerCase();

    if (question.includes("hello") ||
        question.includes("hi")) {

        reply = "Hello! Welcome to our business. How can I help you?";

    } else if (question.includes("service")) {

        reply = "We offer website design, graphic design and business support.";

    } else if (question.includes("price")) {

        reply = "Please tell us which service you need so we can provide a quotation.";

    } else if (question.includes("hour")) {

        reply = "Our business hours are Monday to Saturday, 8 AM to 6 PM.";

    } else if (question.includes("contact")) {

        reply = "You can contact our business by phone or email.";

    } else {

        reply = "Thank you for your message! Please ask about our services, prices, business hours or contact details.";

    }

    let botMessage = document.createElement("div");

    botMessage.className = "bot";

    botMessage.textContent = reply;

    chat.appendChild(botMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
